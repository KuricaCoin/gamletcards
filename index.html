<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamlet Checker</title>

    <!-- Иконка сайта -->
    <link rel="icon" type="image/jpeg" href="photo_2026-09-24_19-14-53.jpg">
    <link rel="apple-touch-icon" href="photo_2026-09-24_19-14-53.jpg">

    <!-- Локальный скрипт сканера -->
    <script src="html5-qrcode.min.js"></script>
    <!-- Резервный источник, если локального файла нет -->
    <script>
        if (typeof Html5Qrcode === 'undefined') {
            document.write('<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"><\/script>');
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        body {
            background-color: #222224;
            color: #e6e6e6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 3.8rem;
            font-weight: normal;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p.subtitle {
            font-size: 1.7rem;
            color: #b0b0b0;
        }

        .scanner-wrapper {
            position: relative;
            width: 100%;
            min-height: 350px;
            border-radius: 16px;
            overflow: hidden;
            background: #181818;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #444444;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            object-fit: cover !important;
        }

        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            height: 260px;
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 5;
        }

        /* Экран запуска / ошибки */
        .camera-message {
            padding: 30px 20px;
            text-align: center;
            font-size: 1.4rem;
            line-height: 1.6;
            color: #d0d0d0;
        }

        .camera-message.error {
            color: #ff6b6b;
        }

        .error-code {
            display: block;
            margin-top: 12px;
            font-size: 1rem;
            color: #777777;
        }

        .btn-camera {
            margin-top: 20px;
            padding: 16px 35px;
            background-color: #ffffff;
            color: #111111;
            border: none;
            border-radius: 8px;
            font-size: 1.4rem;
            cursor: pointer;
        }

        #result-container {
            display: none;
            width: 100%;
            background-color: #2c2c30;
            padding: 40px 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 2px solid #444444;
        }

        .status-original {
            color: #4caf50;
            font-size: 3.2rem;
            margin-bottom: 20px;
        }

        .status-fake {
            color: #f44336;
            font-size: 2.2rem;
            line-height: 1.4;
        }

        .card-image {
            max-width: 100%;
            max-height: 480px;
            border-radius: 10px;
            margin: 20px auto;
            border: 2px solid #555555;
        }

        .btn-restart {
            margin-top: 25px;
            padding: 16px 35px;
            background-color: #e0e0e0;
            color: #111111;
            border: none;
            border-radius: 8px;
            font-size: 1.5rem;
            cursor: pointer;
            width: 100%;
        }

        .btn-restart:hover {
            background-color: #ffffff;
        }

        .rules-container {
            width: 100%;
            margin-top: 40px;
            background-color: #2a2a2d;
            border-radius: 16px;
            padding: 30px;
            border: 1px solid #3a3a3e;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .rules-container h2 {
            font-size: 2.2rem;
            font-weight: normal;
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 1px solid #44444c;
            padding-bottom: 10px;
        }

        .rules-list {
            list-style: none;
            counter-reset: rules-counter;
        }

        .rules-list li {
            counter-increment: rules-counter;
            font-size: 1.5rem;
            line-height: 1.6;
            color: #d0d0d0;
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .rules-list li::before {
            content: counter(rules-counter) ".";
            font-size: 1.6rem;
            font-weight: bold;
            color: #ffffff;
            margin-right: 15px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.8rem; }
            p.subtitle { font-size: 1.3rem; }
            .status-original { font-size: 2.4rem; }
            .status-fake { font-size: 1.7rem; }
            .rules-container h2 { font-size: 1.8rem; }
            .rules-list li { font-size: 1.2rem; }
            .scan-overlay { width: 200px; height: 200px; }
            .camera-message { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Gamlet Checker</h1>
            <p class="subtitle">Проверьте вашу карточку Gamlet Original</p>
        </header>

        <div class="scanner-wrapper" id="scanner-wrapper">
            <div id="reader"></div>
            <div class="scan-overlay" id="scan-overlay" style="display: none;"></div>
        </div>

        <div id="result-container">
            <div id="status-text"></div>
            <img id="card-img" class="card-image" src="" alt="Карточка Gamlet" style="display: none;">
            <button class="btn-restart" onclick="resetScanner()">Сканировать еще раз</button>
        </div>

        <div class="rules-container">
            <h2>Правила гарантии</h2>
            <ol class="rules-list">
                <li>Чтобы сканировался Data Matrix код.</li>
                <li>Чтобы был виден номер карточки.</li>
                <li>Чтобы от карточки осталось больше 50%.</li>
            </ol>
        </div>
    </div>

    <script>
        const validCodes = new Set([
            "xT8k", "Mp2V", "bL9w", "J4zG", "qR7c",
            "vN1m", "H6fX", "sY3d", "K5tP", "W2bP",
            "Z9rK", "f4Mw", "nQ7v", "8YkS", "1MhD",
            "6cxP", "2xRw", "L9qk", "7P3X", "m9v2",
            "fRTb", "N5wL", "q8zA", "5bZk", "C7vN",
            "u9Wx", "h2Ym", "V4kP", "tR8s", "g1jQ"
        ]);

        let html5QrCode = null;
        let isScanning = false;

        // Определяем встроенные браузеры приложений
        function isInAppBrowser() {
            return /Telegram|Instagram|FBAN|FBAV|VKClient|vkontakte|Line\/|WhatsApp/i.test(navigator.userAgent);
        }

        // Экран с кнопкой (нажатие нужно, чтобы браузер показал запрос разрешения)
        function showStartScreen(text, isError, code) {
            document.getElementById('scan-overlay').style.display = 'none';
            document.getElementById('reader').innerHTML =
                `<div class="camera-message ${isError ? 'error' : ''}">
                    ${text}
                    <br><button class="btn-camera" onclick="requestCamera()">Включить камеру</button>
                    ${code ? `<span class="error-code">Код ошибки: ${code}</span>` : ''}
                </div>`;
        }

        // Понятное объяснение ошибки
        function explainError(err) {
            const name = (err && err.name) ? err.name : String(err);

            if (!window.isSecureContext) {
                return ["Сайт открыт не по защищённому протоколу. Откройте адрес, который начинается с https://", name];
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return ["Этот браузер не даёт доступ к камере.<br>Откройте сайт в Chrome или Safari.", name];
            }
            if (window.self !== window.top) {
                return ["Сайт открыт внутри фрейма хостинга, и камера заблокирована.<br>Откройте прямую ссылку на сайт.", name];
            }
            if (isInAppBrowser()) {
                return ["Похоже, сайт открыт внутри приложения (Telegram, VK, Instagram), а оно блокирует камеру.<br>Нажмите ⋮ или ... и выберите «Открыть в браузере».", name];
            }
            if (name === "NotAllowedError" || name === "PermissionDeniedError" || name === "SecurityError") {
                return ["Доступ к камере запрещён для этого сайта.<br>Нажмите на значок слева от адреса сайта → Разрешения → Камера → Разрешить, затем обновите страницу.", name];
            }
            if (name === "NotFoundError" || name === "OverconstrainedError") {
                return ["Камера не найдена на этом устройстве.", name];
            }
            if (name === "NotReadableError" || name === "TrackStartError") {
                return ["Камера занята другим приложением.<br>Закройте другие приложения или вкладки с камерой и попробуйте снова.", name];
            }
            return ["Не удалось включить камеру.", name];
        }

        // Нажатие кнопки: сначала явно просим разрешение у браузера
        async function requestCamera() {
            if (typeof Html5Qrcode === 'undefined') {
                showStartScreen("Библиотека сканера не загрузилась.<br>Проверьте интернет и обновите страницу.", true, "LIB_NOT_LOADED");
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } }
                });
                // Разрешение получено, отпускаем камеру и запускаем сканер
                stream.getTracks().forEach(t => t.stop());
                await startScanner();
            } catch (err) {
                console.error(err);
                const [text, code] = explainError(err);
                showStartScreen(text, true, code);
            }
        }

        async function startScanner() {
            document.getElementById('reader').innerHTML = '';
            document.getElementById('scan-overlay').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");

            const config = {
                fps: 15,
                qrbox: { width: 280, height: 280 },
                formatsToSupport: [ Html5QrcodeSupportedFormats.DATA_MATRIX ]
            };

            try {
                await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
                isScanning = true;
            } catch (err) {
                console.error(err);
                const [text, code] = explainError(err);
                showStartScreen(text, true, code);
            }
        }

        async function onScanSuccess(decodedText) {
            if (!isScanning) return;
            isScanning = false;

            try { await html5QrCode.stop(); } catch (e) {}

            document.getElementById('scanner-wrapper').style.display = 'none';

            const resultContainer = document.getElementById('result-container');
            const statusText = document.getElementById('status-text');
            const cardImg = document.getElementById('card-img');

            resultContainer.style.display = 'block';

            const cleanCode = decodedText.trim();

            if (validCodes.has(cleanCode)) {
                statusText.className = "status-original";
                statusText.innerHTML = "Оригинал";
                cardImg.src = cleanCode + ".png";
                cardImg.style.display = "block";
            } else {
                statusText.className = "status-fake";
                statusText.innerHTML = "Не распознан<br><span style='font-size: 1.4rem; color: #aaaaaa;'>Возможно, ваша карточка не настоящая</span>";
                cardImg.style.display = "none";
            }
        }

        function resetScanner() {
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('scanner-wrapper').style.display = 'flex';
            startScanner();
        }

        // При загрузке: если разрешение уже выдано, запускаем сразу, иначе показываем кнопку
        window.onload = async () => {
            if (isInAppBrowser()) {
                showStartScreen("Похоже, сайт открыт внутри приложения (Telegram, VK, Instagram).<br>Если камера не включится, нажмите ⋮ или ... и выберите «Открыть в браузере».", false);
                return;
            }

            try {
                if (navigator.permissions && navigator.permissions.query) {
                    const status = await navigator.permissions.query({ name: "camera" });
                    if (status.state === "granted") {
                        await startScanner();
                        return;
                    }
                    if (status.state === "denied") {
                        showStartScreen("Доступ к камере запрещён для этого сайта.<br>Нажмите на значок слева от адреса сайта → Разрешения → Камера → Разрешить, затем обновите страницу.", true, "PERMISSION_DENIED");
                        return;
                    }
                }
            } catch (e) {
                // Safari и некоторые браузеры не поддерживают такую проверку, это нормально
            }

            showStartScreen("Нажмите кнопку и разрешите доступ к камере, чтобы отсканировать карточку.", false);
        };
    </script>
</body>
</html>
